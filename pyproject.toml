[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "taskforge"
version = "0.1.0"
description = "Filter a merged pull request from an allowlisted repository, try it in Docker, and publish a task when the gates and quality checks accept."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "pytest>=8",
    "ruff>=0.6",
    "setuptools>=68",
]

[project.scripts]
forge = "forge.cli:app"

[tool.setuptools.packages.find]
include = ["forge*"]

[tool.setuptools.package-data]
forge = ["allowlist.yaml"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["forge", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["forge", "tests"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["forge", "tests"]
mypy_path = "."
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
